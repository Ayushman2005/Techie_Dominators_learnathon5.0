services:
  - type: web
    name: hostel-grievance-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: HOSTEL_ALLOWED_ORIGINS
        value: "*"
